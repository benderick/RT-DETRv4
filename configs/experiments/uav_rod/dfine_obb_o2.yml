__include__: [
  '../../dfine/dfine_obb_o2.yml',
  '../../dataset/uav_rod_obb.yml',
]

output_dir: ./logs/uav_rod/dfine_obb_o2

# UAV-ROD is the first mechanism acceptance dataset.  Full-validation metrics
# are retained for every refinement stage at every epoch, while object-level
# distributions/images are sampled every five epochs for paper figures.
diagnostics_layerwise_epoch_interval: 1
diagnostics_detailed_epoch_interval: 5
diagnostics_detailed_image_limit: 24
diagnostics_query_topk: 20

train_dataloader:
  total_batch_size: 8

val_dataloader:
  total_batch_size: 8
