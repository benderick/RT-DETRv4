# Paper-first benchmark: MODA 9156/4885, 20 epochs, W1216 x H928, global batch8.
# This is an explicit benchmark recipe; validation here is the official test split.
epoches: 20
eval_spatial_size: [928, 1216]
inference_resize_size: [1200, 900]
inference_padding_fill: 0
eval_during_training: True
eval_interval: 1
checkpoint_freq: 1
seed: 0
use_amp: False
use_ema: True
clip_max_norm: 2.0
HGNetv2:
  in_channels: 8
  pretrained: True
  local_model_dir: ./pretrain/hgnetv2/
  freeze_at: -1
  freeze_norm: False
RotatedDFINETransformer:
  num_queries: 500
  box_coordinate_mode: isotropic

num_top_queries: 300
RotatedPostProcessor:
  num_top_queries: 300
  score_threshold: 0.01
  max_detections: 300
  apply_nms: False
  nms_method: probiou_fast
  nms_iou_threshold: 0.7
evaluator:
  __replace__: True
  type: BenchmarkOBBEvaluator
  selection_metric: AP50
  require_complete: True
  compute_geometric: False
optimizer:
  type: AdamW
  params:
    - {params: '^(?=.*backbone)(?!.*norm|bn).*$', lr: 0.00002}
    - {params: '^(?=.*backbone)(?=.*norm|bn).*$', lr: 0.00002, weight_decay: 0.0}
    - {params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$', weight_decay: 0.0}
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  type: MultiStepLR
  milestones: [500]
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500


diagnostics_detailed_epoch_interval: 5
diagnostics_layerwise_epoch_interval: 0
diagnostics_detailed_image_limit: 0
diagnostics_eval_records: compact
diagnostics_query_topk: 20
diagnostics_source_evidence:
  enabled: True
  seed: 20260913
  population_images: 96
  gallery_per_class: 2
  epoch_interval: 5
  query_topk: 20
  save_initial: True
  render: True
  pseudo_rgb_bands: [4, 2, 1]
train_dataloader:
  total_batch_size: 8
  drop_last: False
  dataset:
    root: ./data/MODA/train
    expected_labels: 9156
    split_file: ~
    transforms:
      type: Compose
      ops:
        - {type: RotatedResize, size: [1200, 900]}
        - {type: RotatedPad, size: [1216, 928], fill: 0}
        - {type: RotatedConvertToTensor, normalize_boxes: True, box_coordinate_mode: isotropic}
  collate_fn:
    base_size: [928, 1216]
    base_size_repeat: ~
val_dataloader:
  total_batch_size: 8
  dataset:
    root: ./data/MODA/test
    expected_labels: 4885
    split_file: ~
    transforms:
      type: Compose
      ops:
        - {type: RotatedResize, size: [1200, 900]}
        - {type: RotatedPad, size: [1216, 928], fill: 0}
        - {type: RotatedConvertToTensor, normalize_boxes: True, box_coordinate_mode: isotropic}
  collate_fn:
    base_size: [928, 1216]
    base_size_repeat: ~
