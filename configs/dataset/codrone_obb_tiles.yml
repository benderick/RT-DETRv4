task: detection

num_classes: 12
remap_mscoco_category: False

# Metrics are computed only after all tile predictions have been restored to
# their source 4K image and merged with class-aware rotated NMS.
evaluator:
  type: MergedDotaOBBEvaluator
  use_07_metric: True
  merge_iou_threshold: 0.1
  max_detections_per_image: ~
  require_all_tiles: True

train_dataloader:
  type: DataLoader
  dataset:
    type: CODroneDetection
    root: ../data/CODrone/standard_patches/train
    filter_empty_gt: False
    transforms:
      type: Compose
      ops:
        - {type: RotatedResize, size: [1024, 1024]}
        - {type: RotatedRandomFlip, p: 0.75, directions: [horizontal, vertical, diagonal]}
        - {type: RotatedRandomRotate, p: 0.5, angle_range: 180, fill: 114}
        - {type: RotatedSanitizeBoxes, min_size: 1, min_visible: 0.2}
        - {type: RotatedPad, size: [1024, 1024], fill: 114}
        - {type: RotatedConvertToTensor, normalize_boxes: True}
  shuffle: True
  total_batch_size: 16
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1024
    base_size_repeat: ~
    stop_epoch: ~
    mixup_prob: 0.0

val_dataloader:
  type: DataLoader
  dataset:
    type: CODroneDetection
    root: ../data/CODrone/standard_patches/val
    transforms:
      type: Compose
      ops:
        - {type: RotatedResize, size: [1024, 1024]}
        - {type: RotatedPad, size: [1024, 1024], fill: 114}
        - {type: RotatedSanitizeBoxes, min_size: 1, min_visible: 0.0}
        - {type: RotatedConvertToTensor, normalize_boxes: True}
  shuffle: False
  total_batch_size: 16
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1024
    base_size_repeat: ~
    stop_epoch: ~
    mixup_prob: 0.0
