task: detection
num_classes: 8
remap_mscoco_category: False
class_names: [car, van, truck, bus, tricycle, bike, awning-bike, pedestrian]
inference_padding_fill: 0

# Dataset identity and loader behavior. Spatial preprocessing, evaluation and
# training settings are specified by the shared MODA benchmark protocol.
train_dataloader:
  type: DataLoader
  dataset:
    type: MODADetection
    root: ./data/MODA/train
    expected_labels: 9156
    split_file: ~
  shuffle: True
  total_batch_size: 8
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
    base_size_repeat: ~
    stop_epoch: ~
    mixup_prob: 0.0

val_dataloader:
  type: DataLoader
  dataset:
    type: MODADetection
    root: ./data/MODA/test
    expected_labels: 4885
    split_file: ~
  shuffle: False
  total_batch_size: 8
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
    base_size_repeat: ~
    stop_epoch: ~
