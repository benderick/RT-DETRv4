__include__: [
  '../dataset/codrone_obb.yml',
  '../runtime.yml',
  '../base/optimizer.yml',
  '../base/dfine_obb.yml',
]

# Explicit direct-angle-regression architectural control.
output_dir: ./logs/dfine_obb_angle

RotatedDFINETransformer:
  refinement_mode: direct_angle
  ocd_mode: standard

RotatedRTv4Criterion:
  weight_dict: {
    loss_vfl: 1.0,
    loss_bbox: 5.0,
    loss_angle: 0.0,
    loss_kld: 2.0,
    loss_fgl: 0.15
  }
  # Direct-angle and O² use the same published five-parameter L1/KLD losses;
  # only their refinement representation differs.
  kld_sqrt: True
  kld_fun: log1p
  kld_tau: 1.0
  matcher:
    type: RotatedHungarianMatcher
    weight_dict: {
      cost_class: 2.0,
      cost_bbox: 5.0,
      cost_angle: 2.0,
      cost_kld: 2.0,
      cost_chamfer: 0.5
    }
    kld_sqrt: True
    kld_fun: log1p
    kld_tau: 1.0
    alpha: 0.25
    gamma: 2.0
