__include__: [
  '../dataset/codrone_obb.yml',
  '../runtime.yml',
  '../base/optimizer.yml',
  '../base/dfine_obb.yml',
]

# Primary paper-derived O²-DFINE model.
output_dir: ./logs/dfine_obb_o2

RotatedDFINETransformer:
  refinement_mode: o2_adr
  # D-FINE/O² group-base convention: positive/negative expansion produces
  # approximately 200 actual DN queries from this value of 100.
  num_denoising: 100
  ocd_mode: box
  ocd_crowded_policy: released_dynamic
  ocd_lambda1: 1.0
  ocd_lambda2: 2.0
  ocd_lambda3: 9.0
  ocd_lambda4: 18.0
  ocd_lambda5: 0.3
  ocd_lambda6: 0.6
  reg_max: 32
  adr_a: 0.5
  adr_c: 0.25

# O²/DETR is a set predictor, so full-image inference is NMS-free.  Tile
# variants override this because duplicate removal is part of merging several
# overlapping views back into one source image.
RotatedPostProcessor:
  apply_nms: False

RotatedRTv4Criterion:
  # D-FINE source semantics: decoder-wide geometric union matching.
  use_uni_set: True
  losses: [vfl, boxes, local]
  alpha: 0.75
  gamma: 2.0
  # Released O² configs use KLD(log1p, tau=1, sqrt=False).
  kld_sqrt: False
  kld_fun: log1p
  kld_tau: 1.0
  weight_dict:
    loss_vfl: 1.0
    loss_bbox: 5.0
    loss_angle: 5.0
    loss_kld: 2.0
    loss_fgl: 0.15
  matcher:
    type: RotatedHungarianMatcher
    weight_dict:
      cost_class: 2.0
      cost_bbox: 0.0
      cost_angle: 0.0
      cost_kld: 2.0
      cost_chamfer: 5.0
    # Author-released O² detectors use bidirectional mean Euclidean distance
    # between the four corner sets.
    kld_sqrt: False
    kld_fun: log1p
    kld_tau: 1.0
    alpha: 0.25
    gamma: 2.0
