# Internal D-FINE-OBB-M architecture and optimization contract.
# Public direct-angle and O² recipes are sibling specializations of this
# file; neither method is allowed to inherit semantics from the other.

diagnostics_enabled: True
diagnostics_train_interval: 50
diagnostics_detailed_image_limit: 64
diagnostics_detailed_epoch_interval: 10
diagnostics_layerwise_epoch_interval: 10
diagnostics_query_topk: 50

model: RTv4
criterion: RotatedRTv4Criterion
postprocessor: RotatedPostProcessor
eval_spatial_size: [1024, 1024]
use_focal_loss: True
num_top_queries: 300

RTv4:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: RotatedDFINETransformer

HGNetv2:
  name: B2
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: True
  local_model_dir: ./pretrain/hgnetv2/

HybridEncoder:
  in_channels: [384, 768, 1536]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  expansion: 1.0
  depth_mult: 0.67
  act: silu

RotatedDFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  dim_feedforward: 1024
  num_levels: 3
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  # The first decoder layer's detached traditional OBB pre-box is a fixed
  # refinement anchor and therefore requires its own pre_outputs supervision.
  aux_loss: True
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  ocd_crowded_policy: released_dynamic
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: default

RotatedPostProcessor:
  num_top_queries: 300
  score_threshold: 0.05
  nms_iou_threshold: 0.1
  max_detections: 300
  apply_nms: False

RotatedRTv4Criterion:
  losses: [vfl, boxes, local]
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  use_uni_set: True

optimizer:
  type: AdamW
  params:
    - {params: '^(?=.*backbone)(?!.*norm|bn).*$', lr: 0.000005}
    - {params: '^(?=.*backbone)(?=.*norm|bn).*$', lr: 0.000005, weight_decay: 0.0}
    - {params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$', weight_decay: 0.0}
  lr: 0.00005
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epoches: 72
lr_scheduler:
  type: MultiStepLR
  milestones: [500]
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500

lrsheduler: ~
clip_max_norm: 0.1
checkpoint_freq: 12
print_freq: 100

train_dataloader:
  total_batch_size: 8

val_dataloader:
  total_batch_size: 8

use_amp: True
use_ema: True
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0
sync_bn: False
find_unused_parameters: False
