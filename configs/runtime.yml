print_freq: 500
output_dir: './logs'
checkpoint_freq: 12
# Validate every N completed training epochs. The final epoch is always
# validated even when the total epoch count is not divisible by this value.
eval_interval: 1


sync_bn: True
find_unused_parameters: False


use_amp: False
scaler:
  type: GradScaler
  enabled: True


use_ema: False
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
